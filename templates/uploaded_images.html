<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Images</title>
    <style>
        .image-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .image-item {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .predicted{
        background-color: black;
        color: white;
        justify-items: center;
       }
    </style>
</head>
<body>


    <div class="predicted"><h1>Uploaded Images</h1></div>
    <div class="image-gallery">
        {% for image in images %}
            <div class="image-item">
                <img src="{{ url_for('uploaded_file', filename=image) }}" alt="{{ image }}">
            </div>
        {% endfor %}
    </div>
</body>
</html>
