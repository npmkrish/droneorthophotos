<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <link rel="stylesheet" href="style2.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      body {
        width: 100vw;
        height: 100vh;
        background: url("C:/Users/DEEPANSHU/OneDrive/Gambar/login bg.png")
          no-repeat;
        background-position: center;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 400px;
        height: 500px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);

        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;

        border-radius: 20px;
        border: 3px solid rgba(255, 255, 255, 0.5);
      }

      h2 {
        color: #ffff;
        font-size: 2em;
        text-transform: uppercase;
        padding: 20px 0;
      }

      .form-group {
        position: relative;
        width: 330px;
        margin: 30px 0;
        border-bottom: 3px solid #ffff;
      }

      .form-group input {
        width: 100%;
        height: 50px;
        padding: 0 35px 0 10px;
        font-size: 1.2em;
        background-color: transparent;
        border: none;
        outline: none;
        color: #fff;
      }

      .form-group label {
        position: absolute;
        top: 50%;
        left: 10px;
        transform: translateY(-50%);
        font-size: 1.2em;
        color: #fff;
        transition: 0.5s;
      }

      input:focus ~ label,
      input:valid ~ label {
        top: -5px;
      }

      .form-group i {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        color: #ffff;
        font-size: 1.2em;
      }

      p {
        text-align: center;
        color: #fff;
        margin: 10px 0;
      }

      p > a {
        text-decoration: none;
        color: #fff;
        font-weight: 600;
      }

      p > a:hover {
        text-decoration: underline;
        font-style: italic;
      }

      #btn {
        width: 100%;
        height: 50px;
        border-radius: 40px;
        border: none;
        font-size: 1.5em;
        text-transform: uppercase;
        font-weight: 600;
        margin: 10px 0;
        cursor: pointer;
        transition: all 0.5s;
      }

      #btn:hover {
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Login</h2>

      <!-- Login form with Flask action -->
      <form id="loginForm" action="/login" method="POST">
        <div class="form-group">
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter your email"
            required
          />
          <label for="email">Email</label>
        </div>

        <div class="form-group">
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter your password"
            required
          />
          <label for="password">Password</label>
        </div>

        <p>
          <input type="checkbox" id="rememberMe" /> Remember Me
        </p>

        <button type="submit" id="btn">Login</button>

        <p>Don't have an account? <a href="/register">Register</a></p>
      </form>

      <!-- Show alert if passed from Flask -->
      {% if alert_message %}
      <script>
        alert("{{ alert_message }}");
      </script>
      {% endif %}
    </div>
  </body>
</html>
